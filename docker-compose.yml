services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa"]
      interval: 2s
      retries: 30

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DOCQA_DATABASE_URL: postgresql://docqa:docqa@db:5432/docqa
      DOCQA_LLM_API_KEY: ${DOCQA_LLM_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
